{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row mb-4">
        <div class="col-12">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-3">
                    <li class="breadcrumb-item"><a href="{{ url_for('admin_dashboard') }}" class="text-decoration-none"><i class="bi bi-house me-1"></i>Dashboard</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Edit Route</li>
                </ol>
            </nav>
            <h1 class="fw-bold text-dark mb-1"><i class="bi bi-pencil-square text-primary me-3"></i>Edit Route</h1>
            <p class="text-muted mb-0">Update route and fare information</p>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-white border-0 pt-4 pb-3">
                    <h5 class="fw-bold text-dark mb-0"><i class="bi bi-signpost-2-fill text-primary me-2"></i>Route Details</h5>
                </div>
                <div class="card-body p-4">
                    <form method="post" class="user-select-none">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label for="from" class="form-label fw-semibold text-dark"><i class="bi bi-geo-alt-fill text-primary me-1"></i>From Location</label>
                                <input type="text" class="form-control form-control-lg rounded-3" id="from" name="from" value="{{ route.from_location.name }}" required>
                                <input type="hidden" id="from_lat" name="from_lat" value="{{ route.from_location.lat or '' }}">
                                <input type="hidden" id="from_lng" name="from_lng" value="{{ route.from_location.lng or '' }}">
                            </div>
                            <div class="col-md-6 mb-4">
                                <label for="to" class="form-label fw-semibold text-dark"><i class="bi bi-geo-alt-fill text-success me-1"></i>To Location</label>
                                <input type="text" class="form-control form-control-lg rounded-3" id="to" name="to" value="{{ route.to_location.name }}" required>
                                <input type="hidden" id="to_lat" name="to_lat" value="{{ route.to_location.lat or '' }}">
                                <input type="hidden" id="to_lng" name="to_lng" value="{{ route.to_location.lng or '' }}">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label for="fare" class="form-label fw-semibold text-dark"><i class="bi bi-cash text-warning me-1"></i>Fare Amount</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light">₹</span>
                                    <input type="number" step="0.01" min="0" class="form-control form-control-lg rounded-end" id="fare" name="fare" value="{{ route.fare }}" required>
                                </div>
                            </div>
                            <div class="col-md-6 mb-4">
                                <label for="type" class="form-label fw-semibold text-dark"><i class="bi bi-diagram-3 text-info me-1"></i>Route Type</label>
                                <select class="form-select form-select-lg rounded-3" id="type" name="type" required>
                                    <option value="direct" {% if route.type == 'direct' %}selected{% endif %}>Direct Route</option>
                                    <option value="indirect" {% if route.type == 'indirect' %}selected{% endif %}>Indirect Route</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-4" id="viaDiv" style="{% if route.type == 'indirect' %}display: block;{% else %}display: none;{% endif %}">
                            <label for="via" class="form-label fw-semibold text-dark"><i class="bi bi-arrow-right-circle text-secondary me-1"></i>Via Location</label>
                            <input type="text" class="form-control form-control-lg rounded-3" id="via" name="via" value="{{ route.via_location.name if route.via_location else '' }}" {% if route.type == 'indirect' %}required{% endif %}>
                            <input type="hidden" id="via_lat" name="via_lat" value="{{ route.via_location.lat if route.via_location and route.via_location.lat is not none else '' }}">
                            <input type="hidden" id="via_lng" name="via_lng" value="{{ route.via_location.lng if route.via_location and route.via_location.lng is not none else '' }}">
                            <div class="form-text">For indirect routes, specify the connecting location</div>
                        </div>
                        <div class="mb-4">
                            <label for="notes" class="form-label fw-semibold text-dark">Notes</label>
                            <textarea class="form-control rounded-3" id="notes" name="notes" rows="3">{{ route.notes or '' }}</textarea>
                        </div>
                        <div class="d-flex gap-3 pt-3">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill px-5"><i class="bi bi-check-circle me-2"></i>Save Changes</button>
                            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary btn-lg rounded-pill px-4"><i class="bi bi-x-circle me-2"></i>Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('type').addEventListener('change', function() {
    const viaDiv = document.getElementById('viaDiv');
    const viaInput = document.getElementById('via');
    const indirect = this.value === 'indirect';
    viaDiv.style.display = indirect ? 'block' : 'none';
    viaInput.required = indirect;
});
</script>
<style>
.form-control:focus, .form-select:focus { border-color: var(--primary-color); box-shadow: 0 0 0 0.2rem rgba(var(--bs-primary-rgb), 0.15); }
.input-group-text { border-color: var(--border-color); }
</style>
{% endblock %}
