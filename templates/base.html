<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TrueFare - Never Get Overcharged Again{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --dark-gradient: linear-gradient(135deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.8) 100%);
            --glass-bg: rgba(255,255,255,0.1);
            --glass-border: rgba(255,255,255,0.2);
            --shadow-light: 0 8px 32px rgba(0,0,0,0.1);
            --shadow-medium: 0 12px 40px rgba(0,0,0,0.15);
            --shadow-strong: 0 20px 60px rgba(0,0,0,0.2);
            --text-white: #ffffff;
            --text-light-gray: #e0e0e0;
            --text-dark: #1a1a1a;
            --text-gray: #6c757d;
            --text-shadow-strong: 0 2px 10px rgba(0,0,0,0.8), 0 1px 5px rgba(0,0,0,0.6);
        }

        * {
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--primary-gradient);
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        /* Full-screen background with city theme */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1449824913935-59a10b8d2000?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2070&q=80') no-repeat center center;
            background-size: cover;
            z-index: -2;
        }

        /* Dark gradient overlay - STRONGER for better text readability */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.85) 100%);
            backdrop-filter: blur(1px);
            z-index: -1;
        }

        /* Navigation */
        .navbar {
            background: var(--glass-bg) !important;
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: var(--shadow-light);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            color: white !important;
        }

        .nav-link {
            color: var(--text-white) !important;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            color: white !important;
            transform: translateY(-1px);
        }

        /* Hero Section */
        .hero-section {
            min-height: 80vh;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .hero-overlay {
            width: 100%;
            padding: 4rem 0;
        }

        .hero-title {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            font-weight: 800;
            color: var(--text-white) !important;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8), 0 2px 10px rgba(0,0,0,0.6);
            margin-bottom: 1.5rem;
            line-height: 1.1;
            animation: fadeInUp 1s ease-out;
        }

        .hero-subtitle {
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            color: var(--text-light-gray) !important;
            text-shadow: 0 2px 10px rgba(0,0,0,0.7), 0 1px 5px rgba(0,0,0,0.5);
            margin-bottom: 1rem;
            font-weight: 500;
            animation: fadeInUp 1.2s ease-out;
        }

        .hero-description {
            font-size: 1.1rem;
            color: var(--text-light-gray) !important;
            text-shadow: 0 1px 5px rgba(0,0,0,0.6), 0 1px 3px rgba(0,0,0,0.4);
            margin-bottom: 0;
            font-weight: 400;
            animation: fadeInUp 1.4s ease-out;
        }

        /* Search Section */
        .search-section {
            padding: 4rem 0;
            position: relative;
        }

        .search-card {
            background: rgba(255,255,255,0.95) !important;
            backdrop-filter: blur(20px) !important;
            border: 1px solid rgba(255,255,255,0.3) !important;
            border-radius: 20px !important;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3) !important;
            animation: fadeInUp 1.6s ease-out;
        }

        .search-card .card-body {
            padding: 3rem;
        }

        .search-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-dark) !important;
            margin-bottom: 0.5rem;
            text-shadow: none;
        }

        .search-subtitle {
            color: var(--text-gray) !important;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            text-shadow: none;
        }

        /* Form Elements */
        .form-floating {
            position: relative;
        }

        .form-control {
            background: rgba(255,255,255,0.9) !important;
            border: 2px solid rgba(0,0,0,0.1) !important;
            border-radius: 15px !important;
            color: var(--text-dark) !important;
            font-weight: 500;
            padding: 1rem 3rem 1rem 1rem !important;
            transition: all 0.3s ease;
        }

        .form-control::placeholder {
            color: var(--text-gray) !important;
        }

        .form-control:focus {
            background: rgba(255,255,255,1) !important;
            border-color: #667eea !important;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25) !important;
            transform: translateY(-2px);
            color: var(--text-dark) !important;
        }

        .input-icon {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-gray);
            font-size: 1.2rem;
            z-index: 5;
        }

        /* Buttons */
        .btn-primary {
            background: var(--secondary-gradient) !important;
            border: none !important;
            border-radius: 50px !important;
            padding: 1rem 2.5rem !important;
            font-weight: 600 !important;
            font-size: 1.1rem !important;
            box-shadow: var(--shadow-medium) !important;
            transition: all 0.3s ease !important;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn-primary:hover {
            transform: translateY(-3px) !important;
            box-shadow: var(--shadow-strong) !important;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-outline-primary {
            border: 2px solid rgba(255,255,255,0.3) !important;
            color: white !important;
            border-radius: 50px !important;
            padding: 0.75rem 2rem !important;
            font-weight: 500 !important;
            transition: all 0.3s ease !important;
        }

        .btn-outline-primary:hover {
            background: rgba(255,255,255,0.1) !important;
            border-color: rgba(255,255,255,0.5) !important;
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium);
        }

        .result-card {
            background: rgba(255,255,255,0.95) !important;
            backdrop-filter: blur(20px) !important;
            border: 1px solid rgba(255,255,255,0.3) !important;
            border-radius: 20px !important;
            padding: 2rem !important;
            margin-top: 2rem !important;
            animation: slideInUp 0.5s ease-out;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3) !important;
        }

        .fare-display {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .fare-amount {
            font-size: 3rem;
            font-weight: 800;
            color: var(--text-dark) !important;
            text-shadow: none !important;
            margin-bottom: 0.5rem;
        }

        .fare-badge {
            display: inline-block;
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-verified {
            background: linear-gradient(45deg, #10b981, #059669);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .badge-estimated {
            background: linear-gradient(45deg, #f59e0b, #d97706);
            color: white;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }

        .fare-explanation {
            color: var(--text-gray) !important;
            font-size: 0.95rem;
            text-align: center;
            margin-top: 1rem;
            text-shadow: none;
        }

        /* Feature Highlights */
        .feature-highlights {
            margin-top: 3rem;
            animation: fadeInUp 2s ease-out;
        }

        .feature-item {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 1rem 1.5rem;
            margin: 0.5rem;
            font-weight: 500;
            color: var(--text-white);
            transition: all 0.3s ease;
        }

        .feature-item:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-medium);
            background: rgba(255,255,255,0.15);
        }

        .feature-icon {
            margin-right: 0.75rem;
            font-size: 1.2rem;
            color: #10b981;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 2.5rem;
            }
            .search-card .card-body {
                padding: 2rem;
            }
            .feature-highlights {
                margin-top: 2rem;
            }
            .feature-item {
                margin: 0.25rem;
                padding: 0.75rem 1rem;
                font-size: 0.9rem;
            }
            .feature-card {
                padding: 2rem 1.5rem;
                margin-bottom: 2rem;
            }
            .feature-card-icon {
                width: 70px;
                height: 70px;
                font-size: 1.8rem;
            }
            .features-heading {
                font-size: 2.2rem;
            }
            .footer-section {
                padding: 2rem 0 1.5rem;
            }
            .footer-brand {
                font-size: 1.1rem;
            }
        }

        /* Modal Enhancements */
        .modal-content {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px !important;
            color: var(--text-white);
        }

        .modal-header {
            border-bottom: 1px solid var(--glass-border);
        }

        .modal-footer {
            border-top: 1px solid var(--glass-border);
        }

        /* Features Section */
        .features-section {
            padding: 5rem 0;
            position: relative;
        }

        .features-heading {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 700;
            color: white;
            margin-bottom: 1rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            animation: fadeInUp 1s ease-out;
        }

        .features-subheading {
            font-size: 1.2rem;
            color: var(--text-light-gray);
            font-weight: 400;
            margin-bottom: 0;
            animation: fadeInUp 1.2s ease-out;
        }

        .feature-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            text-align: center;
            transition: all 0.3s ease;
            height: 100%;
            animation: fadeInUp 1.4s ease-out;
        }

        .feature-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-strong);
            background: rgba(255,255,255,0.15);
        }

        .feature-card-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2rem;
            color: white;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
        }

        .feature-card:hover .feature-card-icon {
            transform: scale(1.1);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.4);
        }

        .feature-card-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-white);
            margin-bottom: 1rem;
            text-shadow: var(--text-shadow-strong);
        }

        .feature-card-description {
            color: var(--text-light-gray);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 0;
        }

        /* Trust Section */
        .trust-section {
            padding: 3rem 0;
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }

        .trust-text {
            font-size: 1.1rem;
            color: var(--text-white);
            font-weight: 500;
            margin-bottom: 0;
            font-style: italic;
            animation: fadeInUp 0.8s ease-out;
        }

        /* Footer */
        .footer-section {
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 3rem 0 2rem;
            margin-top: 4rem;
        }

        .footer-main {
            font-size: 1.1rem;
            color: var(--text-white);
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .footer-brand {
            font-size: 1.3rem;
            color: white;
            font-weight: 600;
            margin-bottom: 0.5rem;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }

        .footer-tagline {
            font-size: 0.95rem;
            color: var(--text-light-gray);
            font-weight: 400;
            margin-bottom: 0;
            font-style: italic;
        }
    </style>
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">

</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ 'danger' if category == 'error' else 'success' if category == 'success' else 'info' }} alert-dismissible fade show position-fixed" style="top: 20px; right: 20px; z-index: 1050; max-width: 400px;" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
